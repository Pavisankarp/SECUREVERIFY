{% extends "base.html" %}
{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; height: 100%;">
    
    <div style="display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 450px;">
        
        <div class="card" style="width: 100%; margin-bottom: 15px;">
            <h2>Register Document</h2>
            <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 20px;">Store a new digital fingerprint.</p>
            <form method="POST" enctype="multipart/form-data">
                <input type="text" name="reg_no" placeholder="Student Reg Number" required>
                <select name="document_type" required>
                    <option value="" disabled selected>Select Document Type</option>
                    <option value="TC">Transfer Certificate (TC)</option>
                    <option value="Marksheet">Marksheet</option>
                </select>
                <input type="file" name="file" required>
                <button type="submit">Register</button>
            </form>
        </div>

        <a href="/dashboard" style="color: #888; text-decoration: none; font-size: 0.95rem; margin-top: 10px;">← Back to Dashboard</a>

    </div>

</div>
{% endblock %}
