{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="card">
        <h2>Issuer Portal</h2>
        <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 20px;">Restricted Access</p>
        <form action="/login" method="POST">
            <input type="password" name="password" placeholder="Admin Password" required style="text-align: center;">
            {% if error %}
                <p class="status-error" style="margin-top: 10px;">{{ error }}</p>
            {% endif %}
            <button type="submit">Login</button>
        </form>
    </div>
</div>
{% endblock %}
